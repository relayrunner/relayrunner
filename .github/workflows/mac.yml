name: Mac app

# Manual only for now: GitHub's hosted macOS pool often has no free
# runner, and queued jobs are cancelled after 15 minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build the app
    runs-on: macos-15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # build-app.sh reads versions with Node and builds the CLI with Rust.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: swift test
        working-directory: apps/mac
      - run: bash apps/mac/scripts/build-app.sh
