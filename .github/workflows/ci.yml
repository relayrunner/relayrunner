name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Asks RelayRunner where to run `check`. The repo is public, so it never gets a machine: the
  # workspace's runner order picks Blacksmith or GitHub-hosted.
  relay:
    uses: relayrunner/actions/.github/workflows/relay.yml@v1.0.0-beta.5
    with:
      blacksmith: blacksmith-2vcpu-ubuntu-2404
      github: ubuntu-latest

  check:
    name: Lint, type-check, and test
    needs: relay
    runs-on: ${{ needs.relay.outputs.runner }}
    env:
      HUSKY: "0"
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # A changeset naming anything but the published CLI would stop the
      # Release workflow after merge, so catch it here.
      - run: pnpm changeset:lint
      - name: Verify npm package
        run: bash scripts/smoke-npm-package.sh
