name: CI

# Pull requests get their run from pull_request, so push runs only on main. Running both would
# check every pull request commit twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run. Runs on main each get their own group, so
# none is cancelled.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Asks RelayRunner where to run `check`. The repo is public, so it never gets a machine: the
  # workspace's runner order picks Blacksmith or GitHub-hosted.
  relay:
    uses: relayrunner/actions/.github/workflows/relay.yml@v1.0.0-beta.5
    with:
      blacksmith: blacksmith-2vcpu-ubuntu-2404
      github: ubuntu-latest

  check:
    name: Lint, type-check, and test
    needs: relay
    runs-on: ${{ needs.relay.outputs.runner }}
    env:
      HUSKY: "0"
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # A changeset naming anything but the CLI or the Mac app would stop the
      # Release workflow after merge, so catch it here.
      - run: pnpm changeset:lint
      # The Rust build of the CLI, which npm ships and the Mac menu bar app bundles.
      - name: Test the Rust CLI
        working-directory: apps/cli-rs
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
      # What npm ships: `relayrunner` and the package with this platform's binary, checked
      # through the launcher with scripts/smoke-cli-binary.sh.
      - name: Verify npm packages
        run: bash scripts/smoke-npm-package.sh
      # The single-file Bun build of the TypeScript CLI.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Verify compiled CLI
        run: |
          bash scripts/build-cli-binary.sh bun-linux-x64
          bash scripts/smoke-cli-binary.sh apps/cli/dist-bin/relayrunner-linux-x64
