name: Apply D1 migrations

# Applies apps/api/migrations to the production D1 database (relayrunner) on every merge to main
# that touches them. Needs the CLOUDFLARE_API_TOKEN repo secret (D1 Edit on the RelayRunner account;
# wrangler.jsonc pins the account id).
on:
  push:
    branches: [main]
    paths:
      - apps/api/migrations/**
      - apps/api/wrangler.jsonc
      - apps/api/scripts/rename-legacy-migrations.sql
      - .github/workflows/d1-migrations.yml
  workflow_dispatch:

permissions:
  contents: read

# Never run two applies against the same database at once, and never cancel one midway.
concurrency:
  group: d1-migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production D1
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      HUSKY: "0"
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN secret (D1 Edit on the RelayRunner account)."
            exit 1
          fi
      - name: List pending migrations
        run: pnpm --filter @relayrunner/api exec wrangler d1 migrations list relayrunner --remote
      - name: Apply migrations
        run: pnpm --filter @relayrunner/api db:migrate:remote
