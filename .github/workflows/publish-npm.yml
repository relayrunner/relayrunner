name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # npm only accepts provenance from GitHub-hosted runners, so this job
    # must not run on Blacksmith or any self-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag
        shell: bash
        run: |
          version="$(node -p 'require("./apps/cli/package.json").version')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "::error::Select the stable release tag matching apps/cli/package.json (v$version)."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Pack, verify, and publish
        shell: bash
        run: |
          package_dir="$(mktemp -d)"
          pnpm --dir apps/cli pack --pack-destination "$package_dir"
          tarballs=("$package_dir"/relayrunner-*.tgz)
          bash scripts/smoke-npm-package.sh "${tarballs[0]}"
          npm publish "${tarballs[0]}" --access public
