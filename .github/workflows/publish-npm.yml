# Releases the relayrunner CLI to npm with changesets.
#
# - Pending .changeset/*.md files: open or update the "chore: version packages" PR.
# - None left (that PR was just merged): if npm doesn't have the version in
#   apps/cli/package.json yet, build the Rust CLI for each platform, publish
#   one package per platform and then `relayrunner`, which installs the right
#   one (scripts/npm-packages.mjs), then tag v<version> and create a GitHub
#   release.
#
# npm trusted publishing is set up for this file name (publish-npm.yml), so
# keep the name. There's no NPM_TOKEN secret.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version or check npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the version branch
      pull-requests: write # open the version PR
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so changesets can find the last release.
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      # Versioning only. Publishing is its own step below, because passing
      # `publish:` here makes the action write a token-based .npmrc, which
      # doesn't work with trusted publishing.
      - name: Open or update the version PR
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: pnpm run changeset:version
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is on npm
        id: version
        if: steps.changesets.outputs.hasChangesets == 'false'
        shell: bash
        run: |
          version="$(node -p 'require("./apps/cli/package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "relayrunner@$version" version >/dev/null 2>&1; then
            echo "relayrunner@$version is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, runner: macos-15 }
          - { platform: darwin-x64, target: x86_64-apple-darwin, runner: macos-15 }
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { platform: linux-x64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Static Linux binaries, so they run on any distribution.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: apps/cli
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --locked --release --target "${{ matrix.target }}"
          mkdir -p ../../bins
          cp "target/${{ matrix.target }}/release/relayrunner" "../../bins/relayrunner-${{ matrix.platform }}"
      # The Intel Mac build can't run on this Apple silicon runner.
      - if: matrix.platform != 'darwin-x64'
        run: bash scripts/smoke-cli-binary.sh bins/relayrunner-${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relayrunner-${{ matrix.platform }}
          path: bins/relayrunner-${{ matrix.platform }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build]
    # npm only accepts provenance from GitHub-hosted runners, so this job
    # must not run on Blacksmith or any self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # tag the release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relayrunner-*
          path: bins
          merge-multiple: true

      - name: Pack, verify, and publish
        shell: bash
        run: |
          out="$(mktemp -d)"
          mapfile -t tarballs < <(node scripts/npm-packages.mjs bins "$out")
          [[ "${#tarballs[@]}" -eq 5 ]] || { echo "Expected 5 tarballs, got ${#tarballs[@]}." >&2; exit 1; }
          bash scripts/smoke-npm-package.sh "$out/relayrunner-${{ needs.version.outputs.version }}.tgz" "$out/relayrunner-cli-linux-x64-${{ needs.version.outputs.version }}.tgz"
          # Platform packages first, so `relayrunner` never points at one that isn't there. A rerun
          # skips what's already published.
          for tarball in "${tarballs[@]}"; do
            name="$(tar -xOzf "$tarball" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); `${p.name}@${p.version}`')"
            if npm view "$name" version >/dev/null 2>&1; then
              echo "$name is already on npm."
            else
              npm publish "$tarball" --access public
            fi
          done

      - name: Tag and create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="$(awk -v v="## $VERSION" '
            $0 == v { found=1; next }
            found && /^## / { exit }
            found { print }
          ' apps/cli/CHANGELOG.md 2>/dev/null || true)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
              --notes "${notes:-relayrunner $VERSION}"
          fi
