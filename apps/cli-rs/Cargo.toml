[package]
name = "relayrunner"
version = "0.0.0-spike"
edition = "2024"
publish = false
description = "Spike: `relayrunner connect --events` in Rust, to measure size and effort."
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt",
  "macros",
  "process",
  "time",
  "signal",
  "io-std",
  "io-util",
  "sync",
  "fs",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
