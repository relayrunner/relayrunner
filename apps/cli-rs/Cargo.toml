[package]
name = "relayrunner"
version = "0.0.0"
edition = "2024"
publish = false
description = "The relayrunner CLI in Rust."
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
  "rt",
  "macros",
  "process",
  "time",
  "signal",
  "io-std",
  "io-util",
  "sync",
  "fs",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
] }
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "json",
  "platform-verifier",
] }
url = "2"
yaml-rust2 = { version = "0.13.0", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
