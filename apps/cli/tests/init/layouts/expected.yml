# Layouts init has to edit without touching anything else.
name: Layouts
on: [push]

jobs:
  # The first job, with a comment above it.
  relay-build:
    uses: relayrunner/actions/.github/workflows/relay.yml@<relay>
    with:
      os: linux

  build:
    needs: relay-build
    runs-on: ${{ needs.relay-build.outputs.runner }} # where it ran before
    steps:
      - run: make build

  relay-test:
    uses: relayrunner/actions/.github/workflows/relay.yml@<relay>
    with:
      os: linux

  test:
    needs: [build, relay-test]
    runs-on: ${{ needs.relay-test.outputs.runner }}
    steps:
      - run: make test

  relay-e2e:
    uses: relayrunner/actions/.github/workflows/relay.yml@<relay>
    with:
      os: linux
      cpus: 4

  e2e:
    needs: [build, test, relay-e2e]
    runs-on: ${{ needs.relay-e2e.outputs.runner }}
    steps:
      - run: make e2e

  relay-docs:
    uses: relayrunner/actions/.github/workflows/relay.yml@<relay>
    with:
      os: linux

  docs:
    needs:
      - build
      - relay-docs
    runs-on: ${{ needs.relay-docs.outputs.runner }}
    steps:
      - run: make docs

  relay-relay-package:
    uses: relayrunner/actions/.github/workflows/relay.yml@<relay>
    with:
      os: linux

  relay-package:
    needs: relay-relay-package
    runs-on: ${{ needs.relay-relay-package.outputs.runner }}
    steps:
      - run: echo "a job that already has the relay's name"

  relay-package-2:
    uses: relayrunner/actions/.github/workflows/relay.yml@<relay>
    with:
      os: linux

  package:
    needs: relay-package-2
    runs-on: ${{ needs.relay-package-2.outputs.runner }}
    steps:
      - run: make package

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: make deploy

  shared:
    uses: ./.github/workflows/shared.yml
