name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: npm run lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - run: npm test

  arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: npm test

  mac:
    runs-on: macos-15
    steps:
      - run: swift test

  mac-intel:
    runs-on: macos-13
    steps:
      - run: swift test

  mac-large:
    runs-on: macos-latest-large
    steps:
      - run: swift test

  mac-xlarge:
    runs-on: macos-latest-xlarge
    steps:
      - run: swift test

  windows:
    runs-on: windows-latest
    steps:
      - run: npm test

  matrix:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - run: npm test
