<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>relayrunner Open Graph image source</title>
    <style>
      @font-face {
        font-family: "Hanken Grotesk";
        src: url("../node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 800;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
        color: #0e1a11;
        font-family: "Hanken Grotesk", system-ui, sans-serif;
      }
      .card {
        display: grid;
        grid-template-columns: 1fr 470px;
        gap: 48px;
        align-items: center;
        height: 100%;
        padding: 0 72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 26px;
        font-weight: 700;
      }
      .brand img {
        width: 40px;
        height: 40px;
        border-radius: 11px;
      }
      h1 {
        margin: 36px 0 0;
        font-size: 74px;
        line-height: 1;
        letter-spacing: -0.045em;
      }
      h1 span {
        display: block;
        color: #178a2e;
      }
      p {
        margin: 24px 0 0;
        max-width: 560px;
        color: #39463c;
        font-size: 24px;
        line-height: 1.45;
      }
      .panel {
        position: relative;
        padding: 28px;
        border-radius: 28px;
        background: linear-gradient(140deg, #52c93c 0%, #2db83a 45%, #129a3c 100%);
      }
      .mascot {
        position: absolute;
        right: -18px;
        top: -96px;
        width: 128px;
      }
      .push {
        padding: 12px 16px;
        border-radius: 12px;
        background: #ffffff;
        font:
          500 17px "JetBrains Mono",
          monospace;
      }
      .push span {
        color: #677269;
      }
      .lanes {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 14px;
      }
      .lane {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.85);
        font-size: 19px;
        font-weight: 700;
      }
      .lane img {
        width: 34px;
        height: 34px;
      }
      .lane em {
        margin-left: auto;
        color: #677269;
        font-size: 15px;
        font-style: normal;
        font-weight: 600;
      }
      .lane.on {
        background: #ffffff;
      }
      .lane.on em {
        color: #178a2e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <div class="brand"><img src="../public/mascot-tile.webp" alt="" />relayrunner</div>
        <h1>One router for <span>every CI runner.</span></h1>
        <p>
          Send each GitHub Actions job to the best runner available right now. No workflow changes.
        </p>
      </div>
      <div class="panel">
        <img class="mascot" src="../public/mascot.webp" alt="" />
        <div class="push"><span>$</span> git push <span>→ ci / test</span></div>
        <div class="lanes">
          <div class="lane on">
            <img src="../public/providers/machines.svg" alt="" />Your machines<em
              >Takes the next job</em
            >
          </div>
          <div class="lane">
            <img src="../public/providers/github.svg" alt="" />GitHub-hosted<em>Next</em>
          </div>
          <div class="lane">
            <img src="../public/providers/blacksmith.svg" alt="" />Blacksmith<em>Fallback</em>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
