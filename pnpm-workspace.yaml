packages:
  - "apps/*"
  - "packages/*"
# Versions shared by more than one package. Reference them as "catalog:".
catalog:
  "typescript": ^7.0.2
  "vite": ^8.3.5
  "wrangler": ^4.157.0
  "@cloudflare/workers-types": ^5.20261104.1
  "@types/node": ^22.20.5
  "better-auth": ^1.7.16
  "zod": ^4.6.7
  "@fontsource-variable/hanken-grotesk": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
# pnpm 11 fails installs when a dependency's build script is neither allowed
# nor denied. esbuild and workerd need theirs to fetch platform binaries.
allowBuilds:
  esbuild: true
  workerd: true
  # posthog-js pulls in core-js, whose script only prints a funding notice.
  core-js: false
# pnpm 11 holds back releases newer than a day (minimumReleaseAge). These
# lockfile entries were published inside that window; drop them once they age.
minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.16"
  - "@better-auth/drizzle-adapter@1.7.16"
  - "@better-auth/kysely-adapter@1.7.16"
  - "@better-auth/memory-adapter@1.7.16"
  - "@better-auth/mongo-adapter@1.7.16"
  - "@better-auth/prisma-adapter@1.7.16"
  - "@better-auth/telemetry@1.7.16"
  - "@cloudflare/workers-types@5.20261104.1"
  - better-auth@1.7.16
  - better-call@1.4.5
  - electron-to-chromium@1.5.475
  - "@astrojs/internal-helpers@0.13.2"
  - "@astrojs/markdown-satteri@0.4.8"
  - "@astrojs/runtime@0.1.0"
  - "@astrojs/vite-plugin-astro@0.1.1"
  - astro@7.4.10
